# プッシュとプルリクエストのたびに、ビルドと単体テストを通す
name: Test

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # 手元と同じ Xcode 26 系で確かめる
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Xcode のバージョン
        run: xcodebuild -version

      - name: XcodeGen を入れる
        run: brew install xcodegen

      - name: 単体テスト
        run: make test
